<!-- Save as glass-card.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>

    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- small animated gradient for subtle movement -->
    <linearGradient id="moving" gradientTransform="translate(0)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10">
        <animate attributeName="offset" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- background (you can remove or swap) -->
  <image href="https://source.unsplash.com/1600x400/?city,night" x="0" y="0" width="1200" height="400" preserveAspectRatio="xMidYMid slice"/>

  <!-- frosted rounded rectangle -->
  <g filter="url(#blur)">
    <rect x="60" y="40" rx="20" ry="20" width="1080" height="320" fill="url(#g1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  </g>

  <!-- inner glow / shine -->
  <rect x="64" y="44" rx="18" ry="18" width="1072" height="312" fill="url(#shine)" opacity="0.9"/>

  <!-- content text -->
  <g font-family="Inter, Arial, sans-serif" fill="#ffffff" opacity="0.95">
    <text x="120" y="140" font-size="34" font-weight="700">Swalihu — Glass README</text>
    <text x="120" y="180" font-size="18" opacity="0.9">Make your README look frosted and modern with an SVG card.</text>
  </g>
</svg>
