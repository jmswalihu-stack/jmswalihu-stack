<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#08101a"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <linearGradient id="sh" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <g filter="url(#f1)">
    <rect x="60" y="40" rx="18" ry="18" width="880" height="220" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
  </g>

  <rect x="64" y="44" rx="14" ry="14" width="872" height="212" fill="url(#sh)" opacity="0.9">
    <animate attributeName="x" values="64;800;64" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="120" y="140" font-family="Inter, Arial" font-size="32" fill="#fff">Glass effect in README (SVG)</text>
  <text x="120" y="175" font-family="Inter, Arial" font-size="14" fill="#ddd" opacity="0.9">Place this file in your repo and reference it with &lt;img src=&quot;./glass-shimmer.svg&quot;&gt;</text>
</svg>
