<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <rect width="1000" height="300" fill="black"/>

  <!-- static stars -->
  <circle cx="150" cy="60" r="2" fill="white"/>
  <circle cx="400" cy="120" r="1.5" fill="white"/>
  <circle cx="700" cy="80" r="2" fill="white"/>
  <circle cx="900" cy="200" r="1" fill="white"/>

  <!-- shooting star -->
  <g>
    <circle r="2.5" fill="white">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M 1000 40 L 0 280"/>
    </circle>
    <path d="M0 0 L -50 -15" stroke="white" stroke-width="1" opacity="0.6">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M 1000 40 L 0 280"/>
    </path>
  </g>

  <!-- your content over background -->
  <text x="500" y="160" font-size="40" font-family="sans-serif" fill="white" text-anchor="middle">
    🚀 Swalihu’s README
  </text>
  <text x="500" y="200" font-size="18" font-family="sans-serif" fill="lightgray" text-anchor="middle">
    Shooting star background effect
  </text>
</svg>
